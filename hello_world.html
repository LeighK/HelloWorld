<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="All Timers">
  <meta name="theme-color" content="#0a0a0a">
  <title>All Timers</title>
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;600;700&family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #0a0a0a;
      --card: #141414;
      --card2: #1a1a1a;
      --border: #2a2a2a;
      --text: #ffffff;
      --muted: #666;
      --green: #4cd137;
      --blue: #4a9eff;
      --purple: #8b5cf6;
      --orange: #f59e0b;
      --red: #ef4444;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body { height: 100%; overscroll-behavior: none; }

    body {
      font-family: 'Roboto', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-top);
      padding-bottom: calc(var(--safe-bottom) + 72px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* ── Top Bar ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px 10px;
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
    }
    .topbar-menu {
      width: 40px; height: 40px;
      background: #222;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      border: none;
      flex-shrink: 0;
    }
    .topbar-menu span {
      display: flex; flex-direction: column; gap: 4px;
    }
    .topbar-menu span i {
      display: block; width: 16px; height: 2px;
      background: white; border-radius: 2px;
    }
    .topbar-title {
      font-family: 'Roboto', sans-serif;
      font-weight: 600;
      font-size: 17px;
      letter-spacing: 0.2px;
    }
    .topbar-time {
      font-family: 'Roboto', sans-serif;
      font-weight: 500;
      font-size: 17px;
      min-width: 40px;
      text-align: right;
    }

    /* Dots */
    .dot-row {
      display: flex; justify-content: center;
      gap: 8px;
      padding-bottom: 12px;
    }
    .dot-row span {
      width: 9px; height: 9px;
      border-radius: 50%;
    }
    .dot-row .d1 { background: var(--green); }
    .dot-row .d2 { background: var(--blue); }
    .dot-row .d3 { background: var(--purple); }
    .dot-row .d4 { background: var(--orange); }

    /* ── Main scroll area ── */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 0 12px 12px;
    }

    /* ── Card base ── */
    .card {
      background: var(--card);
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    /* ── TOP CARD: Countdown + Stopwatch side by side ── */
    .card-top {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .card-top .half {
      padding: 16px 14px 14px;
    }
    .card-top .half:first-child {
      border-right: 1px solid var(--border);
    }
    .half-label {
      font-family: 'Roboto', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .half-label.green { color: var(--green); }
    .half-label.blue  { color: var(--blue); }

    /* Ring */
    .ring-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .ring-container {
      position: relative;
      width: 110px; height: 110px;
    }
    .ring-container svg { transform: rotate(-90deg); }
    .ring-bg-c  { fill: none; stroke: #2a2a2a; stroke-width: 7; }
    .ring-fg-c  { fill: none; stroke: var(--green); stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset 0.4s linear; }
    .ring-inner {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .ring-time {
      font-family: 'Roboto Mono', monospace;
      font-size: 22px;
      font-weight: 500;
      color: white;
      letter-spacing: -0.5px;
    }
    .ring-pct {
      font-size: 11px;
      color: var(--green);
      font-weight: 500;
      margin-top: 1px;
    }

    /* CD input inside ring */
    .cd-set-row {
      display: flex; align-items: center; justify-content: center;
      gap: 3px;
    }
    .cd-set-row input {
      width: 34px;
      background: transparent;
      border: none;
      color: white;
      font-family: 'Roboto Mono', monospace;
      font-size: 20px;
      font-weight: 500;
      text-align: center;
      outline: none;
      -webkit-appearance: none;
      padding: 0;
    }
    .cd-set-row .colon {
      font-family: 'Roboto Mono', monospace;
      font-size: 20px;
      color: var(--muted);
      line-height: 1;
    }

    /* Stopwatch side */
    .sw-time {
      font-family: 'Roboto Mono', monospace;
      font-size: 34px;
      font-weight: 400;
      color: white;
      letter-spacing: -1px;
      margin-bottom: 4px;
      line-height: 1;
    }
    .sw-millis { font-size: 0.5em; color: var(--muted); }
    .sw-lap {
      font-family: 'Roboto', sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: var(--blue);
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    /* Buttons */
    .btn-row {
      display: flex; gap: 8px;
      margin-top: 4px;
    }
    .btn {
      flex: 1;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 11px 10px;
      border-radius: 12px;
      border: none;
      font-family: 'Roboto', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      touch-action: manipulation;
      min-height: 44px;
      color: white;
    }
    .btn:active { transform: scale(0.94); opacity: 0.85; }
    .btn-green  { background: var(--green); color: #000; }
    .btn-stop   { background: #2a2a2a; color: white; }
    .btn-purple { background: var(--purple); color: white; }
    .btn-orange { background: var(--orange); color: #000; }
    .btn-reset  { background: #222; color: white; border: 1px solid #333; }
    .btn svg { flex-shrink: 0; }

    /* ── Row card (Added Time / ATCD) ── */
    .card-row {
      display: flex;
      align-items: center;
      gap: 0;
      padding: 0;
      position: relative;
    }
    .row-accent {
      width: 4px;
      align-self: stretch;
      border-radius: 0 0 0 0;
      flex-shrink: 0;
    }
    .row-accent.purple { background: var(--purple); }
    .row-accent.orange { background: var(--orange); }

    .row-body {
      flex: 1;
      padding: 14px 12px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .row-label {
      font-family: 'Roboto', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .row-label.purple { color: var(--purple); }
    .row-label.orange { color: var(--orange); }

    .row-main {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* small ring for row cards */
    .mini-ring { position: relative; width: 52px; height: 52px; flex-shrink: 0; }
    .mini-ring svg { transform: rotate(-90deg); }
    .mini-ring-bg  { fill: none; stroke: #2a2a2a; stroke-width: 5; }
    .mini-ring-fg  { fill: none; stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset 0.4s linear; }
    .mini-ring-fg.purple { stroke: var(--purple); }
    .mini-ring-fg.orange { stroke: var(--orange); }
    .mini-pct {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Roboto', sans-serif;
      font-size: 9px;
      color: var(--muted);
      font-weight: 500;
    }

    .row-info { flex: 1; }
    .row-time {
      font-family: 'Roboto Mono', monospace;
      font-size: 36px;
      font-weight: 400;
      letter-spacing: -1px;
      line-height: 1;
    }
    .row-time.purple { color: var(--purple); }
    .row-time.orange { color: var(--orange); }
    .row-time.danger { color: var(--red); animation: blink 0.8s step-end infinite; }
    .row-time .rm { font-size: 0.42em; color: var(--muted); vertical-align: middle; }
    .row-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .row-sub span { color: var(--purple); }

    .row-actions {
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 14px 12px 14px 0;
      align-items: flex-end;
    }
    .btn-sq {
      width: 60px; height: 60px;
      border-radius: 14px;
      border: none;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 3px;
      cursor: pointer;
      font-family: 'Roboto', sans-serif;
      font-size: 11px;
      font-weight: 600;
      touch-action: manipulation;
      transition: opacity 0.15s, transform 0.1s;
      color: white;
    }
    .btn-sq:active { transform: scale(0.92); }
    .btn-sq.purple { background: var(--purple); }
    .btn-sq.orange { background: var(--orange); color: #000; }
    .btn-sq.grey   { background: #232323; border: 1px solid #333; }

    .done-badge {
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--red);
      font-weight: 700;
      display: none;
      animation: blink 1s step-end infinite;
    }
    .done-badge.visible { display: block; }

    /* ── Reset All ── */
    .card-reset {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      cursor: pointer;
      border: none;
      background: var(--card);
      color: white;
      width: 100%;
      border-radius: 18px;
      font-family: 'Roboto', sans-serif;
    }
    .card-reset:active { opacity: 0.7; }
    .reset-text { display: flex; flex-direction: column; align-items: flex-start; }
    .reset-title { font-weight: 600; font-size: 15px; }
    .reset-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }

    /* ── Bottom Nav ── */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #111;
      border-top: 1px solid #222;
      display: flex;
      padding-bottom: var(--safe-bottom);
      z-index: 20;
    }
    .nav-item {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 10px 0 8px;
      gap: 4px;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: 'Roboto', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.2px;
      position: relative;
      touch-action: manipulation;
    }
    .nav-item.active { color: var(--green); }
    .nav-item.active::after {
      content: '';
      position: absolute;
      bottom: 0; left: 20%; right: 20%;
      height: 2px;
      background: var(--green);
      border-radius: 2px 2px 0 0;
    }
    .nav-icon {
      width: 24px; height: 24px;
      border-radius: 50%;
      border: 2.5px solid currentColor;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .nav-icon.plus::before, .nav-icon.plus::after {
      content: '';
      position: absolute;
      background: currentColor;
      border-radius: 1px;
    }
    .nav-icon.plus::before { width: 10px; height: 2px; }
    .nav-icon.plus::after  { width: 2px; height: 10px; }
    .nav-dot {
      width: 6px; height: 6px;
      background: currentColor;
      border-radius: 50%;
    }
    .nav-hand {
      width: 1.5px; height: 7px;
      background: currentColor;
      transform-origin: bottom center;
      transform: rotate(-20deg) translateX(1px);
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* Prevent double-tap zoom */
    * { touch-action: manipulation; }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="topbar">
    <button class="topbar-menu" aria-label="Menu">
      <span><i></i><i></i><i></i></span>
    </button>
    <div class="topbar-title">All Timers</div>
    <div class="topbar-time" id="clock">--:--</div>
  </div>
  <div class="dot-row">
    <span class="d1"></span><span class="d2"></span>
    <span class="d3"></span><span class="d4"></span>
  </div>

  <div class="content">

    <!-- TOP CARD: Countdown + Stopwatch -->
    <div class="card card-top">
      <!-- Countdown half -->
      <div class="half">
        <div class="half-label green">Countdown</div>
        <div class="ring-wrap">
          <div class="ring-container" id="cd-ring-wrap">
            <svg width="110" height="110" viewBox="0 0 110 110">
              <circle class="ring-bg-c" cx="55" cy="55" r="46"/>
              <circle class="ring-fg-c" id="cd-ring-fg" cx="55" cy="55" r="46"
                stroke-dasharray="289.0" stroke-dashoffset="0"/>
            </svg>
            <div class="ring-inner">
              <!-- Input mode -->
              <div id="cd-input-mode">
                <div class="cd-set-row">
                  <input id="cd-min" type="number" min="0" max="99" value="05">
                  <span class="colon">:</span>
                  <input id="cd-sec" type="number" min="0" max="59" value="00">
                </div>
              </div>
              <!-- Running mode -->
              <div id="cd-run-mode" style="display:none; text-align:center;">
                <div class="ring-time" id="cd-time-display">05:00</div>
                <div class="ring-pct" id="cd-pct">100%</div>
              </div>
            </div>
          </div>
        </div>
        <div class="btn-row">
          <button class="btn btn-green" id="cd-btn" onclick="cdToggle()">
            <svg width="12" height="14" viewBox="0 0 12 14" fill="currentColor"><path d="M0 0l12 7L0 14z"/></svg>
            <span id="cd-btn-label">Start</span>
          </button>
          <button class="btn btn-stop" onclick="cdReset()">
            <svg width="11" height="11" viewBox="0 0 11 11" fill="currentColor"><rect width="11" height="11" rx="2"/></svg>
            Stop
          </button>
        </div>
        <div class="done-badge" id="cd-done" style="margin-top:6px;text-align:center;">Time's up!</div>
      </div>

      <!-- Stopwatch half -->
      <div class="half" style="display:flex;flex-direction:column;justify-content:space-between;">
        <div class="half-label blue">Stopwatch</div>
        <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 0;">
          <div class="sw-time" id="sw-display">00:00<span class="sw-millis">.00</span></div>
          <div class="sw-lap">Starts with countdown</div>
        </div>
      </div>
    </div>

    <!-- ADDED TIME -->
    <div class="card card-row">
      <div class="row-accent purple"></div>
      <div class="row-body">
        <div class="row-label purple">Added Time</div>
        <div class="row-main">
          <div class="row-info">
            <div class="row-time purple" id="at-display">00:00<span class="rm">.00</span></div>
            <div class="row-sub">Total Added</div>
          </div>
        </div>
      </div>
      <div class="row-actions">
        <button class="btn-sq purple" id="at-btn" onclick="atToggle()">
          <svg width="14" height="16" viewBox="0 0 14 16" fill="white"><path d="M0 0l14 8L0 16z"/></svg>
          <span id="at-btn-label">Start</span>
        </button>
        <button class="btn-sq grey" onclick="atReset()">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M13.5 8A5.5 5.5 0 1 1 10 3.07"/><polyline points="10,1 10,4 13,4"/></svg>
          <span style="font-size:10px;color:#aaa;">Reset</span>
        </button>
      </div>
    </div>

    <!-- ADDED TIME COUNTDOWN -->
    <div class="card card-row">
      <div class="row-accent orange"></div>
      <div class="row-body">
        <div class="row-label orange">Added Time Countdown</div>
        <div class="row-main">
          <div class="mini-ring" id="atcd-mini-ring">
            <svg width="52" height="52" viewBox="0 0 52 52">
              <circle class="mini-ring-bg" cx="26" cy="26" r="21"/>
              <circle class="mini-ring-fg orange" id="atcd-ring-fg" cx="26" cy="26" r="21"
                stroke-dasharray="131.9" stroke-dashoffset="0"/>
            </svg>
            <div class="mini-pct" id="atcd-ring-pct">100%</div>
          </div>
          <div class="row-info">
            <div class="row-time orange" id="atcd-display">00:00<span class="rm">.00</span></div>
            <div class="row-sub" id="atcd-source">set from <span>added time</span></div>
            <div class="done-badge" id="atcd-done">Time's up!</div>
          </div>
        </div>
      </div>
      <div class="row-actions">
        <button class="btn-sq orange" id="atcd-btn" onclick="atcdToggle()">
          <svg width="14" height="16" viewBox="0 0 14 16" fill="#000"><path d="M0 0l14 8L0 16z"/></svg>
          <span id="atcd-btn-label" style="color:#000;">Start</span>
        </button>
        <button class="btn-sq grey" onclick="atcdReset()">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M13.5 8A5.5 5.5 0 1 1 10 3.07"/><polyline points="10,1 10,4 13,4"/></svg>
          <span style="font-size:10px;color:#aaa;">Reset</span>
        </button>
      </div>
    </div>

    <!-- RESET ALL -->
    <button class="card card-reset" onclick="resetAll()">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round">
        <path d="M19 11A8 8 0 1 1 14 4.1"/><polyline points="14,1 14,5 18,5"/>
      </svg>
      <div class="reset-text">
        <div class="reset-title">Reset All</div>
        <div class="reset-sub">Reset all timers and added time</div>
      </div>
    </button>

  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <button class="nav-item active">
      <div class="nav-icon"><div class="nav-dot"></div></div>
      Countdown
    </button>
    <button class="nav-item">
      <div class="nav-icon"><div class="nav-hand"></div></div>
      Stopwatch
    </button>
    <button class="nav-item">
      <div class="nav-icon plus"></div>
      Added Time
    </button>
    <button class="nav-item" style="color: var(--orange);">
      <div class="nav-icon" style="border-color:var(--orange);"></div>
      Added CD
    </button>
  </nav>

  <script>
    // Clock
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2,'0');
      const m = String(now.getMinutes()).padStart(2,'0');
      document.getElementById('clock').textContent = h+':'+m;
    }
    updateClock(); setInterval(updateClock, 10000);

    // ── 1 & 2: Countdown + Stopwatch ──
    let mainTicker = null, mainRunning = false;
    let swElapsed = 0, swStart = 0;
    let cdRemaining = 0, cdTotal = 0, cdStart = 0;

    function mainTick() {
      const now = Date.now();
      swElapsed = now - swStart;
      const swMs = swElapsed%1000, swS = Math.floor(swElapsed/1000)%60, swM = Math.floor(swElapsed/60000);
      document.getElementById('sw-display').innerHTML =
        pad(swM)+':'+pad(swS)+'<span class="sw-millis">.'+pad(Math.floor(swMs/10))+'</span>';

      cdRemaining = Math.max(0, cdTotal-(now-cdStart));
      const cdS = Math.floor(cdRemaining/1000)%60, cdM = Math.floor(cdRemaining/60000);
      const pct = cdTotal > 0 ? cdRemaining/cdTotal : 0;
      document.getElementById('cd-time-display').textContent = pad(cdM)+':'+pad(cdS);
      document.getElementById('cd-pct').textContent = Math.ceil(pct*100)+'%';
      document.getElementById('cd-ring-fg').style.strokeDashoffset = 289.0*(1-pct);

      if (cdRemaining === 0) {
        clearInterval(mainTicker); mainTicker = null; mainRunning = false;
        document.getElementById('cd-btn-label').textContent = 'Start';
        document.getElementById('cd-done').classList.add('visible');
      }
    }

    function cdToggle() {
      if (!mainRunning) {
        if (cdRemaining === 0) {
          cdTotal = cdGetInput();
          if (cdTotal === 0) return;
          cdRemaining = cdTotal;
        }
        document.getElementById('cd-done').classList.remove('visible');
        document.getElementById('cd-input-mode').style.display = 'none';
        document.getElementById('cd-run-mode').style.display = 'block';
        const now = Date.now();
        cdStart = now-(cdTotal-cdRemaining);
        swStart = now-swElapsed;
        mainTicker = setInterval(mainTick, 50);
        mainRunning = true;
        document.getElementById('cd-btn-label').textContent = 'Pause';
      } else {
        clearInterval(mainTicker); mainTicker = null; mainRunning = false;
        document.getElementById('cd-btn-label').textContent = 'Resume';
      }
    }

    function cdReset() {
      clearInterval(mainTicker); mainTicker = null; mainRunning = false;
      swElapsed = 0; cdRemaining = 0; cdTotal = 0;
      document.getElementById('cd-btn-label').textContent = 'Start';
      document.getElementById('cd-input-mode').style.display = 'block';
      document.getElementById('cd-run-mode').style.display = 'none';
      document.getElementById('cd-ring-fg').style.strokeDashoffset = 0;
      document.getElementById('cd-done').classList.remove('visible');
      document.getElementById('sw-display').innerHTML = '00:00<span class="sw-millis">.00</span>';
    }

    function cdGetInput() {
      const m = parseInt(document.getElementById('cd-min').value)||0;
      const s = parseInt(document.getElementById('cd-sec').value)||0;
      return (m*60+s)*1000;
    }

    // ── 3: Added Time ──
    let atTicker = null, atRunning = false, atElapsed = 0, atStart = 0;

    function atToggle() {
      if (!atRunning) {
        atStart = Date.now()-atElapsed;
        atTicker = setInterval(atTick, 50);
        atRunning = true;
        document.getElementById('at-btn-label').textContent = 'Pause';
      } else {
        clearInterval(atTicker); atTicker = null; atRunning = false;
        document.getElementById('at-btn-label').textContent = 'Resume';
      }
    }

    function atTick() {
      atElapsed = Date.now()-atStart;
      const ms = atElapsed%1000, s = Math.floor(atElapsed/1000)%60, m = Math.floor(atElapsed/60000);
      document.getElementById('at-display').innerHTML =
        pad(m)+':'+pad(s)+'<span class="rm">.'+pad(Math.floor(ms/10))+'</span>';
      if (!atcdStarted) syncAtcdDisplay();
    }

    function atReset() {
      clearInterval(atTicker); atTicker = null; atRunning = false; atElapsed = 0;
      document.getElementById('at-btn-label').textContent = 'Start';
      document.getElementById('at-display').innerHTML = '00:00<span class="rm">.00</span>';
      if (!atcdStarted) syncAtcdDisplay();
    }

    function syncAtcdDisplay() {
      const rounded = roundUpToMinute(atElapsed);
      const rm = Math.floor(rounded/60000), rs = Math.floor((rounded%60000)/1000);
      document.getElementById('atcd-display').innerHTML =
        pad(rm)+':'+pad(rs)+'<span class="rm">.00</span>';
      document.getElementById('atcd-source').innerHTML =
        rounded > 0
          ? 'set from <span style="color:var(--purple)">added time</span> &mdash; <span style="color:var(--orange)">'+pad(rm)+'m</span>'
          : 'set from <span style="color:var(--purple)">added time</span>';
      document.getElementById('atcd-ring-fg').style.strokeDashoffset = 0;
      document.getElementById('atcd-ring-pct').textContent = '100%';
    }

    // ── 4: Added Time Countdown ──
    let atcdTicker = null, atcdRunning = false, atcdStarted = false;
    let atcdRemaining = 0, atcdTotal = 0, atcdStart = 0;

    function roundUpToMinute(ms) {
      if (ms === 0) return 0;
      return Math.ceil(ms/60000)*60000;
    }

    function atcdToggle() {
      if (!atcdRunning) {
        if (!atcdStarted) {
          atcdTotal = roundUpToMinute(atElapsed);
          if (atcdTotal === 0) return;
          atcdRemaining = atcdTotal;
          atcdStarted = true;
        }
        document.getElementById('atcd-done').classList.remove('visible');
        atcdStart = Date.now()-(atcdTotal-atcdRemaining);
        atcdTicker = setInterval(atcdTick, 50);
        atcdRunning = true;
        document.getElementById('atcd-btn-label').textContent = 'Pause';
      } else {
        clearInterval(atcdTicker); atcdTicker = null; atcdRunning = false;
        document.getElementById('atcd-btn-label').textContent = 'Resume';
      }
    }

    function atcdTick() {
      atcdRemaining = Math.max(0, atcdTotal-(Date.now()-atcdStart));
      const ms = atcdRemaining%1000, s = Math.floor(atcdRemaining/1000)%60, m = Math.floor(atcdRemaining/60000);
      const pct = atcdTotal > 0 ? atcdRemaining/atcdTotal : 0;
      const disp = document.getElementById('atcd-display');
      disp.innerHTML = pad(m)+':'+pad(s)+'<span class="rm">.'+pad(Math.floor(ms/10))+'</span>';
      if (atcdRemaining <= 10000) disp.classList.add('danger'); else disp.classList.remove('danger');
      document.getElementById('atcd-ring-fg').style.strokeDashoffset = 131.9*(1-pct);
      document.getElementById('atcd-ring-pct').textContent = Math.ceil(pct*100)+'%';
      if (atcdRemaining === 0) {
        clearInterval(atcdTicker); atcdTicker = null; atcdRunning = false;
        document.getElementById('atcd-btn-label').textContent = 'Start';
        document.getElementById('atcd-done').classList.add('visible');
      }
    }

    function atcdReset() {
      clearInterval(atcdTicker); atcdTicker = null; atcdRunning = false; atcdStarted = false;
      atcdRemaining = 0; atcdTotal = 0;
      document.getElementById('atcd-btn-label').textContent = 'Start';
      document.getElementById('atcd-done').classList.remove('visible');
      document.getElementById('atcd-display').classList.remove('danger');
      syncAtcdDisplay();
    }

    function resetAll() {
      cdReset(); atReset(); atcdReset();
    }

    function pad(n) { return String(n).padStart(2,'0'); }

    // Prevent double-tap zoom
    let lastTap = 0;
    document.addEventListener('touchend', function(e) {
      const now = Date.now();
      if (now-lastTap < 300) e.preventDefault();
      lastTap = now;
    }, { passive: false });
  </script>
</body>
</html>
