<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Timers">
  <meta name="theme-color" content="#0e0e10">
  <title>Timers</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #0e0e10;
      --surface: #18181c;
      --border: #2a2a30;
      --text: #f0f0f0;
      --muted: #666;
      --up-color: #4ade80;
      --down-color: #f97316;
      --added-color: #a78bfa;
      --atcd-color: #f472b6;
      --btn-bg: #26262c;
      --btn-hover: #32323a;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      height: 100%;
      overscroll-behavior: none;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: calc(var(--safe-top) + 2rem) 1rem calc(var(--safe-bottom) + 2rem);
      gap: 2.5rem;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      position: relative;
    }
    .bg-circles span { position: absolute; border-radius: 50%; pointer-events: none; }
    .bg-circles .c1 { width: 260px; height: 260px; background: #3b82f6; opacity: .06; top: -60px; right: -100px; }
    .bg-circles .c2 { width: 160px; height: 160px; background: #f59e0b; opacity: .06; bottom: -30px; left: -80px; }
    .bg-circles .c3 { width: 100px; height: 100px; background: #10b981; opacity: .06; bottom: 30px; right: 10px; }

    .greeting {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(40px, 10vw, 80px);
      font-weight: 700;
      color: var(--text);
      line-height: 1;
      letter-spacing: -2px;
      text-align: center;
      animation: rise 0.9s cubic-bezier(.22,1,.36,1) both;
    }
    .greeting em { font-style: normal; color: #3b82f6; }

    .sub {
      font-family: 'DM Mono', monospace;
      font-weight: 300;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--muted);
      animation: rise 0.9s 0.2s cubic-bezier(.22,1,.36,1) both;
      opacity: 0;
    }
    .dot {
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #f59e0b;
      margin: 0 5px;
      vertical-align: middle;
      animation: pulse 2s 1.2s ease-in-out infinite;
    }

    .divider {
      width: 100%;
      max-width: 600px;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .divider span {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .timers {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      width: 100%;
      max-width: 600px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem 1.25rem 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      position: relative;
      overflow: hidden;
    }
    .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; border-radius: 16px 16px 0 0; }
    .card.down::before  { background: var(--down-color); }
    .card.up::before    { background: var(--up-color); }
    .card.added::before { background: var(--added-color); }
    .card.atcd::before  { background: var(--atcd-color); }

    .card-label {
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      align-self: flex-start;
      line-height: 1.3;
    }
    .card.down .card-label  { color: var(--down-color); }
    .card.up .card-label    { color: var(--up-color); }
    .card.added .card-label { color: var(--added-color); }
    .card.atcd .card-label  { color: var(--atcd-color); }

    .display {
      font-family: 'DM Mono', monospace;
      font-size: clamp(28px, 7vw, 42px);
      font-weight: 400;
      letter-spacing: -1px;
      line-height: 1;
    }
    .card.down .display  { color: var(--down-color); }
    .card.up .display    { color: var(--up-color); }
    .card.added .display { color: var(--added-color); }
    .card.atcd .display  { color: var(--atcd-color); }
    .card.down .display.danger { color: #ef4444; animation: blink 0.8s step-end infinite; }
    .card.atcd .display.danger { color: #ef4444; animation: blink 0.8s step-end infinite; }

    .millis { font-size: 0.4em; color: var(--muted); vertical-align: middle; }

    .countdown-input-row { display: flex; align-items: center; gap: 0.4rem; }
    .time-input {
      width: 46px;
      background: var(--btn-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      text-align: center;
      padding: 6px 2px;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    .time-input:focus { border-color: var(--down-color); }
    .sep { color: var(--muted); font-family: 'DM Mono', monospace; font-size: 14px; }

    .controls { display: flex; gap: 0.5rem; }

    button {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--btn-bg);
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      touch-action: manipulation;
      min-height: 44px;
    }
    button:active { transform: scale(0.94); }
    button.primary { border-color: transparent; }
    .card.down button.primary  { background: var(--down-color); color: #0e0e10; }
    .card.down button.primary:active { background: #fdba74; }
    .card.added button.primary { background: var(--added-color); color: #0e0e10; }
    .card.added button.primary:active { background: #c4b5fd; }
    .card.atcd button.primary  { background: var(--atcd-color); color: #0e0e10; }
    .card.atcd button.primary:active { background: #f9a8d4; }

    .progress-ring { position: relative; width: 64px; height: 64px; }
    .progress-ring svg { transform: rotate(-90deg); }
    .ring-bg   { fill: none; stroke: var(--border); stroke-width: 3.5; }
    .ring-fill { fill: none; stroke: var(--down-color); stroke-width: 3.5; stroke-linecap: round; transition: stroke-dashoffset 0.5s linear; }
    .ring-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); }

    .done-banner { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #ef4444; display: none; }
    .done-banner.visible { display: block; animation: blink 1s step-end infinite; }

    .sw-hint { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 1px; text-align: center; }

    .atcd-source { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 1px; text-align: center; }
    .atcd-source span { color: var(--added-color); }

    @keyframes rise  { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: .6; } 50% { transform: scale(1.6); opacity: 1; } }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  </style>
</head>
<body>

  <div class="hero">
    <div class="bg-circles">
      <span class="c1"></span><span class="c2"></span><span class="c3"></span>
    </div>
    <div class="greeting"><em>Hello</em> World</div>
    <div class="sub"><span class="dot"></span> welcome to the web <span class="dot"></span></div>
  </div>

  <div class="divider"><span>Timers</span></div>

  <div class="timers">

    <!-- 1. Countdown -->
    <div class="card down">
      <div class="card-label">Countdown</div>
      <div class="countdown-input-row" id="cd-input-row">
        <input class="time-input" id="cd-min" type="number" min="0" max="99" value="05">
        <span class="sep">:</span>
        <input class="time-input" id="cd-sec" type="number" min="0" max="59" value="00">
      </div>
      <div class="display" id="cd-display" style="display:none">05:00<span class="millis">.00</span></div>
      <div class="progress-ring" id="cd-ring" style="display:none">
        <svg width="64" height="64" viewBox="0 0 64 64">
          <circle class="ring-bg" cx="32" cy="32" r="27"/>
          <circle class="ring-fill" id="ring-fill" cx="32" cy="32" r="27" stroke-dasharray="169.6" stroke-dashoffset="0"/>
        </svg>
        <div class="ring-label" id="ring-pct">100%</div>
      </div>
      <div class="done-banner" id="done-banner">Time's up!</div>
      <div class="controls">
        <button class="primary" id="cd-btn" onclick="cdToggle()">Start</button>
        <button onclick="cdReset()">Reset</button>
      </div>
    </div>

    <!-- 2. Stopwatch -->
    <div class="card up">
      <div class="card-label">Stopwatch</div>
      <div class="display" id="sw-display">00:00<span class="millis">.00</span></div>
      <div class="sw-hint">starts with countdown</div>
    </div>

    <!-- 3. Added Time -->
    <div class="card added">
      <div class="card-label">Added Time</div>
      <div class="display" id="at-display">00:00<span class="millis">.00</span></div>
      <div class="controls">
        <button class="primary" id="at-btn" onclick="atToggle()">Start</button>
        <button onclick="atReset()">Reset</button>
      </div>
    </div>

    <!-- 4. Added Time Countdown -->
    <div class="card atcd">
      <div class="card-label">Added Time Countdown</div>
      <div class="display" id="atcd-display">00:00<span class="millis">.00</span></div>
      <div class="atcd-source" id="atcd-source">set from <span>added time</span></div>
      <div class="done-banner" id="atcd-done">Time's up!</div>
      <div class="controls">
        <button class="primary" id="atcd-btn" onclick="atcdToggle()">Start</button>
        <button onclick="atcdReset()">Reset</button>
      </div>
    </div>

  </div>

  <script>
    // ── 1 & 2: Countdown + Stopwatch ──
    let mainTicker = null, mainRunning = false;
    let swElapsed = 0, swStart = 0;
    let cdRemaining = 0, cdTotal = 0, cdStart = 0;

    function mainTick() {
      const now = Date.now();
      swElapsed = now - swStart;
      const swMs = swElapsed%1000, swS = Math.floor(swElapsed/1000)%60, swM = Math.floor(swElapsed/60000);
      document.getElementById('sw-display').innerHTML =
        pad(swM)+':'+pad(swS)+'<span class="millis">.'+pad(Math.floor(swMs/10))+'</span>';

      cdRemaining = Math.max(0, cdTotal - (now - cdStart));
      const cdMs = cdRemaining%1000, cdS = Math.floor(cdRemaining/1000)%60, cdM = Math.floor(cdRemaining/60000);
      const pct = cdTotal > 0 ? cdRemaining/cdTotal : 0;
      document.getElementById('cd-display').innerHTML =
        pad(cdM)+':'+pad(cdS)+'<span class="millis">.'+pad(Math.floor(cdMs/10))+'</span>';
      document.getElementById('ring-fill').style.strokeDashoffset = 169.6*(1-pct);
      document.getElementById('ring-pct').textContent = Math.ceil(pct*100)+'%';

      const disp = document.getElementById('cd-display');
      if (cdRemaining <= 10000) disp.classList.add('danger'); else disp.classList.remove('danger');

      if (cdRemaining === 0) {
        clearInterval(mainTicker); mainTicker = null; mainRunning = false;
        document.getElementById('cd-btn').textContent = 'Start';
        document.getElementById('done-banner').classList.add('visible');
      }
    }

    function cdToggle() {
      const btn = document.getElementById('cd-btn');
      if (!mainRunning) {
        if (cdRemaining === 0) {
          cdTotal = cdGetInput();
          if (cdTotal === 0) return;
          cdRemaining = cdTotal;
        }
        document.getElementById('done-banner').classList.remove('visible');
        document.getElementById('cd-input-row').style.display = 'none';
        document.getElementById('cd-display').style.display = '';
        document.getElementById('cd-ring').style.display = '';
        const now = Date.now();
        cdStart = now - (cdTotal - cdRemaining);
        swStart = now - swElapsed;
        mainTicker = setInterval(mainTick, 50);
        mainRunning = true;
        btn.textContent = 'Pause';
      } else {
        clearInterval(mainTicker); mainTicker = null; mainRunning = false;
        btn.textContent = 'Resume';
      }
    }

    function cdReset() {
      clearInterval(mainTicker); mainTicker = null; mainRunning = false;
      swElapsed = 0; cdRemaining = 0; cdTotal = 0;
      document.getElementById('cd-btn').textContent = 'Start';
      document.getElementById('cd-display').style.display = 'none';
      document.getElementById('cd-ring').style.display = 'none';
      document.getElementById('cd-input-row').style.display = '';
      document.getElementById('done-banner').classList.remove('visible');
      document.getElementById('cd-display').classList.remove('danger');
      document.getElementById('sw-display').innerHTML = '00:00<span class="millis">.00</span>';
    }

    function cdGetInput() {
      const m = parseInt(document.getElementById('cd-min').value)||0;
      const s = parseInt(document.getElementById('cd-sec').value)||0;
      return (m*60+s)*1000;
    }

    // ── 3: Added Time ──
    let atTicker = null, atRunning = false, atElapsed = 0, atStart = 0;

    function atToggle() {
      const btn = document.getElementById('at-btn');
      if (!atRunning) {
        atStart = Date.now() - atElapsed;
        atTicker = setInterval(atTick, 50);
        atRunning = true;
        btn.textContent = 'Pause';
      } else {
        clearInterval(atTicker); atTicker = null; atRunning = false;
        btn.textContent = 'Resume';
      }
    }

    function atTick() {
      atElapsed = Date.now() - atStart;
      const ms = atElapsed%1000, s = Math.floor(atElapsed/1000)%60, m = Math.floor(atElapsed/60000);
      document.getElementById('at-display').innerHTML =
        pad(m)+':'+pad(s)+'<span class="millis">.'+pad(Math.floor(ms/10))+'</span>';
      if (!atcdStarted) {
        const roundedMs = roundUpToMinute(atElapsed);
        const rm = Math.floor(roundedMs/60000), rs = Math.floor((roundedMs%60000)/1000);
        document.getElementById('atcd-display').innerHTML =
          pad(rm)+':'+pad(rs)+'<span class="millis">.00</span>';
        document.getElementById('atcd-source').innerHTML =
          'set from <span>added time</span> &mdash; <span style="color:var(--atcd-color)">'+pad(rm)+'m</span>';
      }
    }

    function atReset() {
      clearInterval(atTicker); atTicker = null; atRunning = false; atElapsed = 0;
      document.getElementById('at-btn').textContent = 'Start';
      document.getElementById('at-display').innerHTML = '00:00<span class="millis">.00</span>';
      if (!atcdStarted) {
        document.getElementById('atcd-display').innerHTML = '00:00<span class="millis">.00</span>';
        document.getElementById('atcd-source').innerHTML = 'set from <span>added time</span>';
      }
    }

    // ── 4: Added Time Countdown ──
    let atcdTicker = null, atcdRunning = false, atcdStarted = false;
    let atcdRemaining = 0, atcdTotal = 0, atcdStart = 0;

    function roundUpToMinute(ms) {
      if (ms === 0) return 0;
      return Math.ceil(ms / 60000) * 60000;
    }

    function atcdToggle() {
      const btn = document.getElementById('atcd-btn');
      if (!atcdRunning) {
        if (!atcdStarted) {
          atcdTotal = roundUpToMinute(atElapsed);
          if (atcdTotal === 0) return;
          atcdRemaining = atcdTotal;
          atcdStarted = true;
        }
        document.getElementById('atcd-done').classList.remove('visible');
        atcdStart = Date.now() - (atcdTotal - atcdRemaining);
        atcdTicker = setInterval(atcdTick, 50);
        atcdRunning = true;
        btn.textContent = 'Pause';
      } else {
        clearInterval(atcdTicker); atcdTicker = null; atcdRunning = false;
        btn.textContent = 'Resume';
      }
    }

    function atcdTick() {
      atcdRemaining = Math.max(0, atcdTotal - (Date.now() - atcdStart));
      const ms = atcdRemaining%1000, s = Math.floor(atcdRemaining/1000)%60, m = Math.floor(atcdRemaining/60000);
      document.getElementById('atcd-display').innerHTML =
        pad(m)+':'+pad(s)+'<span class="millis">.'+pad(Math.floor(ms/10))+'</span>';

      const disp = document.getElementById('atcd-display');
      if (atcdRemaining <= 10000) disp.classList.add('danger'); else disp.classList.remove('danger');

      if (atcdRemaining === 0) {
        clearInterval(atcdTicker); atcdTicker = null; atcdRunning = false;
        document.getElementById('atcd-btn').textContent = 'Start';
        document.getElementById('atcd-done').classList.add('visible');
      }
    }

    function atcdReset() {
      clearInterval(atcdTicker); atcdTicker = null; atcdRunning = false; atcdStarted = false;
      atcdRemaining = 0; atcdTotal = 0;
      document.getElementById('atcd-btn').textContent = 'Start';
      document.getElementById('atcd-done').classList.remove('visible');
      document.getElementById('atcd-display').classList.remove('danger');
      const roundedMs = roundUpToMinute(atElapsed);
      const rm = Math.floor(roundedMs/60000), rs = Math.floor((roundedMs%60000)/1000);
      document.getElementById('atcd-display').innerHTML =
        pad(rm)+':'+pad(rs)+'<span class="millis">.00</span>';
      document.getElementById('atcd-source').innerHTML =
        atElapsed > 0
          ? 'set from <span>added time</span> &mdash; <span style="color:var(--atcd-color)">'+pad(rm)+'m</span>'
          : 'set from <span>added time</span>';
    }

    function pad(n) { return String(n).padStart(2,'0'); }

    // Prevent double-tap zoom on iOS
    let lastTap = 0;
    document.addEventListener('touchend', function(e) {
      const now = Date.now();
      if (now - lastTap < 300) e.preventDefault();
      lastTap = now;
    }, { passive: false });
  </script>

</body>
</html>
