
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
.scene{min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 2rem;background:transparent;position:relative;overflow:hidden}
.bg-circles span{position:absolute;border-radius:50%;opacity:.07}
.bg-circles .c1{width:320px;height:320px;background:var(--color-text-info);top:-80px;right:-60px}
.bg-circles .c2{width:200px;height:200px;background:var(--color-text-warning);bottom:-40px;left:-40px}
.bg-circles .c3{width:120px;height:120px;background:var(--color-text-success);bottom:80px;right:60px}
.greeting{font-family:'Playfair Display',Georgia,serif;font-size:clamp(52px,10vw,96px);font-weight:700;color:var(--color-text-primary);line-height:1;letter-spacing:-2px;text-align:center;animation:rise 0.9s cubic-bezier(.22,1,.36,1) both}
.greeting em{font-style:normal;color:var(--color-text-info)}
.sub{font-family:'Lato',sans-serif;font-weight:300;font-size:16px;letter-spacing:4px;text-transform:uppercase;color:var(--color-text-secondary);margin-top:1.2rem;animation:rise 0.9s 0.2s cubic-bezier(.22,1,.36,1) both;opacity:0}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--color-text-warning);margin:0 6px;vertical-align:middle;animation:pulse 2s 1.2s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.6);opacity:1}}
</style>
<div class="scene">
  <div class="bg-circles">
    <span class="c1"></span>
    <span class="c2"></span>
    <span class="c3"></span>
  </div>
  <div class="greeting"><em>Hello</em> World</div>
  <div class="sub"><span class="dot"></span> welcome to the web <span class="dot"></span></div>
</div>
